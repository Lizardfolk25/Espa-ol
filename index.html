  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:#07080f;color:#f0f0f8;font-family:Georgia,serif;-webkit-tap-highlight-color:transparent;}
    #app{min-height:100vh;}
    button{cursor:pointer;border:none;font-family:Georgia,serif;transition:all .18s;}
    button:active{transform:scale(0.97);}
    input{font-family:Georgia,serif;}
    .pill{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.8px;}
    .tag{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
    .card{background:#10111e;border-radius:20px;padding:28px;}
    .progress-bar{height:5px;border-radius:3px;background:#181828;overflow:hidden;}
    .progress-fill{height:100%;border-radius:3px;transition:width .4s;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .fu{animation:fadeUp .3s ease forwards;}
    /* flip card */
    .flip-wrap{perspective:1200px;}
    .flip-inner{position:relative;width:100%;height:260px;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
    .flip-inner.flipped{transform:rotateY(180deg);}
    .flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    .flip-front{background:#10111e;border:1px solid #ffffff16;box-shadow:0 12px 50px #000b;}
    .flip-back{background:#0e0e20;border:1px solid #ffffff16;transform:rotateY(180deg);}
    /* scrollable content */
    .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{border-collapse:collapse;width:100%;font-size:12px;}
    th{padding:9px 10px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;background:#0e0e1c;white-space:nowrap;}
    td{padding:7px 10px;border-bottom:1px solid #ffffff08;white-space:nowrap;}
    tr:hover td{background:#ffffff04;}
    /* inline sentence input */
    .sent-input{display:inline-block;padding:2px 8px;border-radius:8px;font-size:18px;font-style:italic;background:#07080f;color:#a29bfe;border:2px solid #a29bfe55;outline:none;min-width:80px;transition:border .2s;}
    .sent-input:focus{border-color:#a29bfe;}
  </style>
</head>

// ── Storage ──
const STORAGE_KEY="esp-verb-history";
function loadHistory(){try{const v=localStorage.getItem(STORAGE_KEY);return v?JSON.parse(v):[]}catch{return[]}}
function saveHistory(h){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(h))}catch{}}

// ── Helpers ──
function getForma(v,tiempo,i){if(tiempo==="perfecto") return HABER[i]+" "+v.participio;return v[tiempo][i];}
function buildCards(tiempoId){const cards=[];VERBOS.forEach(v=>{PERSONAS.forEach((persona,i)=>{const forma=getForma(v,tiempoId,i);if(forma===null) return;cards.push({id:v.inf+"-"+tiempoId+"-"+i,infinitivo:v.inf,traduccion:v.trad,tipo:v.tipo,persona,forma,tiempo:tiempoId});});});return cards;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTestDeck(tiempoId){const all=buildCards(tiempoId);const irreg=shuffle(all.filter(c=>c.tipo==="nieregularny"));const reg=shuffle(all.filter(c=>c.tipo==="regularny"));const nReg=5+Math.floor(Math.random()*6);return shuffle([...irreg.slice(0,40-nReg),...reg.slice(0,nReg)]);}
function buildSentenceDeck(tiempoId){const sentDB=tiempoId==="impsubj"?SENTENCES_IMPSUBJ:SENTENCES;const deck=[];VERBOS.forEach(v=>{PERSONAS.forEach((persona,pIdx)=>{const fd=sentDB[v.inf]?.[persona];if(!fd) return;const sent=fd[Math.floor(Math.random()*fd.length)];const forma=getForma(v,tiempoId,pIdx);if(forma===null) return;deck.push({id:"s-"+v.inf+"-"+tiempoId+"-"+pIdx,infinitivo:v.inf,traduccion:v.trad,tipo:v.tipo,persona,forma,sentence:sent,tiempo:tiempoId});});});const irreg=shuffle(deck.filter(c=>c.tipo==="nieregularny"));const reg=shuffle(deck.filter(c=>c.tipo==="regularny"));const nReg=5+Math.floor(Math.random()*6);return shuffle([...irreg.slice(0,40-nReg),...reg.slice(0,nReg)]);}
function normalize(s){return(s||"").trim().toLowerCase().replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u").replace(/ü/g,"u").replace(/ñ/g,"n");}
function levenshtein(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++) dp[0][j]=j;for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
function isClose(u,c){const a=normalize(u),b=normalize(c);return a===b||levenshtein(a,b)<=1;}
function fmtTime(t){return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");}

// ── DOM helper ──
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className") el.className=v;
    else if(k==="disabled"){if(v) el.disabled=true;}
    else if(k==="value") el.value=v;
    else if(k==="placeholder") el.placeholder=v;
    else if(k==="id") el.id=v;
    else el.setAttribute(k,v);
  });
  children.flat().forEach(c=>{if(c==null||c===false) return;el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);});
  return el;
}

const S={view:"study",tiempo:"subjuntivo",filter:"all",deck:[],deckIdx:0,flipped:false,known:new Set(),unknown:new Set(),testQ:[],testIdx:0,testIn:"",testAns:{},testRes:[],testDone:false,testTime:1800,testTO:false,testTimer:null,sentQ:[],sentIdx:0,sentIn:"",sentAns:{},sentRes:[],sentDone:false,sentTime:1800,sentTO:false,sentTimer:null};

function getAcc(){return TIEMPOS.find(t=>t.id===S.tiempo).color;}
function getTI(){return TIEMPOS.find(t=>t.id===S.tiempo);}
function resetStudy(){const base=buildCards(S.tiempo);const f=S.filter==="all"?base:base.filter(c=>c.tipo===S.filter);S.deck=shuffle(f);S.deckIdx=0;S.flipped=false;S.known=new Set();S.unknown=new Set();}

function startTest(){
  if(S.testTimer) clearInterval(S.testTimer);
  S.testQ=buildTestDeck(S.tiempo);S.testIdx=0;S.testIn="";S.testAns={};S.testRes=[];S.testDone=false;S.testTime=1800;S.testTO=false;
  S.testTimer=setInterval(()=>{S.testTime--;if(S.testTime<=0){clearInterval(S.testTimer);S.testTO=true;finishTest();return;}const el=document.getElementById("ttimer");if(el){el.textContent="⏱ "+fmtTime(S.testTime);el.style.color=S.testTime<=60?"#e17055":S.testTime<=300?"#fdcb6e":"#888";}},1000);
}
function startSent(){
  if(S.sentTimer) clearInterval(S.sentTimer);
  S.sentQ=buildSentenceDeck(S.tiempo);S.sentIdx=0;S.sentIn="";S.sentAns={};S.sentRes=[];S.sentDone=false;S.sentTime=1800;S.sentTO=false;
  S.sentTimer=setInterval(()=>{S.sentTime--;if(S.sentTime<=0){clearInterval(S.sentTimer);S.sentTO=true;finishSent();return;}const el=document.getElementById("stimer");if(el){el.textContent="⏱ "+fmtTime(S.sentTime);el.style.color=S.sentTime<=60?"#e17055":S.sentTime<=300?"#fdcb6e":"#888";}},1000);
}
function calcResults(questions,idx,curIn,answers){
  return questions.map((q,i)=>{const ans=(i===idx?curIn:(answers[i]||"")).trim();const ok=ans.length>0&&isClose(ans,q.forma);return{card:q,answer:ans||"—",ok,pts:ok?(q.tipo==="nieregularny"?3:2):0};});
}
function saveEntry(results,label){
  const totalPts=results.reduce((s,r)=>s+r.pts,0);const maxPts=results.reduce((s,r)=>s+(r.card.tipo==="nieregularny"?3:2),0);const pct=Math.round(totalPts/maxPts*100);
  const entry={date:Date.now(),tiempo:label,totalPts,maxPts,pct,results:results.map(r=>({card:{infinitivo:r.card.infinitivo,traduccion:r.card.traduccion,tipo:r.card.tipo,persona:r.card.persona},ok:r.ok}))};
  const h=loadHistory();h.push(entry);saveHistory(h);
}
function finishTest(){if(S.testTimer) clearInterval(S.testTimer);S.testRes=calcResults(S.testQ,S.testIdx,S.testIn,S.testAns);S.testDone=true;saveEntry(S.testRes,getTI().label);render();}
function finishSent(){if(S.sentTimer) clearInterval(S.sentTimer);S.sentRes=calcResults(S.sentQ,S.sentIdx,S.sentIn,S.sentAns);S.sentDone=true;saveEntry(S.sentRes,getTI().label+" (zdania)");render();}

resetStudy(); startTest(); startSent();

function navNext(isS){
  if(isS){S.sentAns[S.sentIdx]=S.sentIn;if(S.sentIdx+1>=S.sentQ.length){finishSent();return;}S.sentIdx++;S.sentIn=S.sentAns[S.sentIdx]||"";render();setTimeout(()=>{const e=document.getElementById("sinput");if(e)e.focus();},50);}
  else{S.testAns[S.testIdx]=S.testIn;if(S.testIdx+1>=S.testQ.length){finishTest();return;}S.testIdx++;S.testIn=S.testAns[S.testIdx]||"";render();setTimeout(()=>{const e=document.getElementById("tinput");if(e)e.focus();},50);}
}
function navPrev(isS){
  if(isS){if(S.sentIdx===0) return;S.sentAns[S.sentIdx]=S.sentIn;S.sentIdx--;S.sentIn=S.sentAns[S.sentIdx]||"";render();setTimeout(()=>{const e=document.getElementById("sinput");if(e)e.focus();},50);}
  else{if(S.testIdx===0) return;S.testAns[S.testIdx]=S.testIn;S.testIdx--;S.testIn=S.testAns[S.testIdx]||"";render();setTimeout(()=>{const e=document.getElementById("tinput");if(e)e.focus();},50);}
}

// ── Main render ──
function render(){
  const app=document.getElementById("app");
  while(app.firstChild) app.removeChild(app.firstChild);
  const acc=getAcc(),ti=getTI();

  // Header
  app.appendChild(h("div",{style:{background:"#0a0b16",borderBottom:"1px solid #ffffff10",padding:"12px 14px"}},
    h("div",{style:{display:"flex",flexWrap:"wrap",alignItems:"center",gap:"10px",justifyContent:"space-between"}},
      h("div",null,
        h("div",{style:{fontFamily:"Georgia,serif",fontSize:"18px",fontWeight:"700",color:acc}},ti.label),
        h("div",{style:{fontSize:"10px",color:"#666",letterSpacing:"2px",textTransform:"uppercase"}},"91 czasowników")
      ),
      h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap"}},
        ...[["study","🃏"],["test","✏️"],["sentence","📝"],["stats","📊"],["table","📋"]].map(([v,ic])=>
          h("button",{className:"pill",style:{background:S.view===v?acc:"#181828",color:S.view===v?"#07080f":"#777",fontWeight:S.view===v?"800":"500",fontSize:"16px",padding:"7px 10px"},
            onClick:()=>{
              const prev=S.view; S.view=v;
              if(v==="test" && prev!=="test"){ startTest(); }
              if(v==="sentence" && prev!=="sentence"){ startSent(); }
              render();
            }},ic)
        )
      )
    )
  ));

  // Tiempos
  app.appendChild(h("div",{style:{background:"#09090f",borderBottom:"1px solid #ffffff08",padding:"7px 14px"}},
    h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap"}},
      ...TIEMPOS.map(t=>h("button",{className:"pill",style:{background:S.tiempo===t.id?t.color+"22":"transparent",color:S.tiempo===t.id?t.color:"#444",border:`1px solid ${S.tiempo===t.id?t.color+"55":"#ffffff0d"}`,fontSize:"11px"},
        onClick:()=>{S.tiempo=t.id;resetStudy();startTest();startSent();render();}},t.label))
    )
  ));

  // Content
  const content=document.createElement("div");

  if(S.view==="study"){
    const card=S.deck[S.deckIdx],total=S.deck.length,prog=total>0?Math.round(((S.known.size+S.unknown.size)/total)*100):0;
    const wrap=h("div",{style:{maxWidth:"540px",margin:"0 auto",padding:"18px 14px"}},
      h("div",{style:{display:"flex",gap:"5px",marginBottom:"16px",flexWrap:"wrap"}},
        ...[["all","Wszystkie"],["nieregularny","Nieregularne"],["regularny","Regularne"]].map(([val,lbl])=>
          h("button",{className:"pill",style:{background:S.filter===val?acc+"30":"transparent",color:S.filter===val?acc:"#444",border:`1px solid ${S.filter===val?acc+"44":"#ffffff0d"}`,fontWeight:S.filter===val?"800":"500"},
            onClick:()=>{S.filter=val;resetStudy();render();}},lbl)
        )
      ),
      h("div",{style:{marginBottom:"16px"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"#555",marginBottom:"5px"}},
          document.createTextNode((S.known.size+S.unknown.size)+" / "+total),
          h("span",null,h("span",{style:{color:"#00b894",marginRight:"8px"}},"✓ "+S.known.size),h("span",{style:{color:"#e17055"}},"✗ "+S.unknown.size))
        ),
        progBar(prog,acc)
      )
    );
    if(S.deckIdx>=total&&total>0){
      wrap.appendChild(h("div",{style:{textAlign:"center",padding:"40px 0"}},
        h("div",{style:{fontSize:"44px",marginBottom:"12px"}},"🎉"),
        h("div",{style:{fontFamily:"Georgia,serif",fontSize:"24px",color:acc,marginBottom:"6px"}},"Talia ukończona!"),
        h("div",{style:{fontSize:"12px",color:"#666",marginBottom:"16px"}},"Znasz: "+S.known.size+" · Uczysz się: "+S.unknown.size),
        h("button",{style:{background:acc,color:"#07080f",fontWeight:"800",fontSize:"13px",padding:"11px 26px",borderRadius:"12px"},
          onClick:()=>{resetStudy();render();}},"Zacznij od nowa")
      ));
    } else if(card){
      const flipWrap=h("div",{className:"flip-wrap",style:{cursor:"pointer",userSelect:"none"}});
      const flipInner=h("div",{className:"flip-inner"+(S.flipped?" flipped":"")});
      flipInner.appendChild(h("div",{className:"flip-face flip-front"},
        typeTag(card.tipo),
        h("div",{style:{fontFamily:"Georgia,serif",fontSize:"36px",fontWeight:"700",color:"#f0f0f8",margin:"10px 0 2px"}},card.infinitivo),
        h("div",{style:{fontSize:"13px",color:"#555",fontStyle:"italic",marginBottom:"14px"}},"("+card.traduccion+")"),
        h("div",{style:{background:acc+"15",border:`1px solid ${acc}30`,borderRadius:"10px",padding:"7px 20px"}},
          h("span",{style:{fontWeight:"800",fontSize:"17px",color:acc}},card.persona)),
        h("div",{style:{fontSize:"10px",color:"#2a2a3a",letterSpacing:"1.5px",marginTop:"14px"}},"KLIKNIJ ABY ODKRYĆ")
      ));
      flipInner.appendChild(h("div",{className:"flip-face flip-back"},
        h("span",{className:"tag",style:{background:acc+"20",color:acc,border:`1px solid ${acc}40`,marginBottom:"10px"}},ti.short),
        h("div",{style:{fontSize:"12px",color:"#444",marginBottom:"4px"}},card.infinitivo+" · "+card.persona),
        h("div",{style:{fontFamily:"Georgia,serif",fontSize:"40px",fontWeight:"700",color:acc,marginBottom:"4px",textAlign:"center"}},card.forma),
        h("div",{style:{fontSize:"13px",color:"#555",fontStyle:"italic"}},"("+card.traduccion+")")
      ));
      flipWrap.appendChild(flipInner);
      flipWrap.addEventListener("click",()=>{S.flipped=!S.flipped;render();});
      wrap.appendChild(flipWrap);
      if(!S.flipped){
        wrap.appendChild(h("div",{style:{textAlign:"center",marginTop:"14px"}},
          h("button",{style:{background:acc,color:"#07080f",fontWeight:"800",fontSize:"13px",padding:"11px 32px",borderRadius:"12px"},
            onClick:()=>{S.flipped=true;render();}},"Pokaż odpowiedź")));
      } else {
        wrap.appendChild(h("div",{style:{display:"flex",gap:"8px",marginTop:"14px",justifyContent:"center"}},
          h("button",{style:{background:"linear-gradient(135deg,#e17055,#d63031)",color:"#fff",fontWeight:"800",fontSize:"13px",padding:"11px 20px",borderRadius:"12px"},
            onClick:()=>{S.unknown.add(card.id);S.known.delete(card.id);S.deckIdx++;S.flipped=false;render();}},"✗ Uczę się"),
          h("button",{style:{background:"linear-gradient(135deg,#00b894,#00cec9)",color:"#fff",fontWeight:"800",fontSize:"13px",padding:"11px 20px",borderRadius:"12px"},
            onClick:()=>{S.known.add(card.id);S.unknown.delete(card.id);S.deckIdx++;S.flipped=false;render();}},"✓ Znam!")
        ));
      }
    }
    content.appendChild(wrap);

  } else if(S.view==="test"){
    if(S.testDone) content.appendChild(resultsScreen(S.testRes,S.testTO,ti.label,()=>{startTest();render();},()=>{S.view="study";render();}));
    else content.appendChild(questionScreen(S.testQ[S.testIdx],S.testIdx,S.testIn,"ttimer",S.testTime,false,v=>{S.testIn=v;},()=>navNext(false),()=>navPrev(false)));

  } else if(S.view==="sentence"){
    if(S.sentDone) content.appendChild(resultsScreen(S.sentRes,S.sentTO,ti.label+" (zdania)",()=>{startSent();render();},()=>{S.view="study";render();}));
    else content.appendChild(questionScreen(S.sentQ[S.sentIdx],S.sentIdx,S.sentIn,"stimer",S.sentTime,true,v=>{S.sentIn=v;},()=>navNext(true),()=>navPrev(true)));

  } else if(S.view==="stats"){
    const history=loadHistory();
    const statsDiv=h("div",{style:{maxWidth:"680px",margin:"0 auto",padding:"18px 14px"}});
    if(history.length===0){
      statsDiv.appendChild(h("div",{style:{textAlign:"center",padding:"50px 0"}},
        h("div",{style:{fontSize:"44px",marginBottom:"12px"}},"📊"),
        h("div",{style:{fontFamily:"Georgia,serif",fontSize:"22px",color:acc,marginBottom:"8px"}},"Brak historii"),
        h("button",{style:{background:acc,color:"#07080f",fontWeight:"800",fontSize:"13px",padding:"11px 22px",borderRadius:"12px"},onClick:()=>{S.view="test";render();}},"Idź do testu")
      ));
    } else {
      const verbErrors={};
      history.forEach(test=>test.results.forEach(r=>{const inf=r.card.infinitivo;if(!verbErrors[inf]) verbErrors[inf]={errors:0,attempts:0,trad:r.card.traduccion,tipo:r.card.tipo};verbErrors[inf].attempts++;if(!r.ok) verbErrors[inf].errors++;}));
      const sorted=Object.entries(verbErrors).map(([inf,d])=>({inf,...d,rate:d.errors/d.attempts})).filter(v=>v.attempts>0).sort((a,b)=>b.errors-a.errors||b.rate-a.rate).slice(0,15);
      const totalTests=history.length,avgPct=Math.round(history.reduce((s,t)=>s+t.pct,0)/totalTests),bestPct=Math.max(...history.map(t=>t.pct)),totalPtsAll=history.reduce((s,t)=>s+t.totalPts,0);
      statsDiv.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"8px"}},
        h("div",{style:{fontFamily:"Georgia,serif",fontSize:"20px",fontWeight:"700",color:acc}},"Twoje statystyki"),
        h("button",{style:{background:"transparent",color:"#444",fontSize:"11px",padding:"5px 10px",borderRadius:"8px",border:"1px solid #2a2a3a"},
          onClick:()=>{if(confirm("Usunąć całą historię?")) {saveHistory([]);render();}}},  "Wyczyść")
      ));
      statsDiv.appendChild(h("div",{style:{display:"flex",gap:"7px",marginBottom:"16px",flexWrap:"wrap"}},
        ...[["Testów",totalTests,acc],["Śr.",avgPct+"%","#55efc4"],["Max",bestPct+"%","#fdcb6e"],["Pkt",totalPtsAll,"#fd79a8"]].map(([l,v,c])=>
          h("div",{style:{flex:"1 1 70px",background:"#10111e",border:`1px solid ${c}33`,borderRadius:"10px",padding:"10px 10px",textAlign:"center"}},
            h("div",{style:{fontSize:"9px",color:c,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:"3px"}},l),
            h("div",{style:{fontFamily:"Georgia,serif",fontSize:"20px",fontWeight:"700",color:c}},v)
          )
        )
      ));
      if(sorted.length>0){
        statsDiv.appendChild(h("div",{style:{fontSize:"10px",color:"#555",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}},"Największe problemy"));
        const problemList=h("div",{style:{display:"flex",flexDirection:"column",gap:"5px",marginBottom:"16px"}});
        sorted.forEach((v,i)=>{
          const errRate=Math.round(v.rate*100),barColor=errRate>=70?"#e17055":errRate>=40?"#fdcb6e":"#55efc4";
          problemList.appendChild(h("div",{style:{background:"#10111e",border:`1px solid ${barColor}22`,borderRadius:"10px",padding:"9px 12px",display:"flex",alignItems:"center",gap:"8px"}},
            h("div",{style:{fontSize:"11px",color:"#333",width:"16px",textAlign:"right"}},(i+1)+"."),
            h("div",{style:{flex:"1"}},
              h("div",{style:{display:"flex",alignItems:"baseline",gap:"6px",marginBottom:"4px"}},
                h("span",{style:{fontFamily:"Georgia,serif",fontWeight:"700",fontSize:"15px"}},v.inf),
                h("span",{style:{fontSize:"12px",color:"#555",fontStyle:"italic"}},"("+v.trad+")"),
                h("span",{style:{fontSize:"10px",color:v.tipo==="nieregularny"?"#e8c46a":"#55efc4",marginLeft:"auto"}},v.tipo==="nieregularny"?"niereg.":"reg.")
              ),
              h("div",{className:"progress-bar"},h("div",{className:"progress-fill",style:{width:errRate+"%",background:barColor}}))
            ),
            h("div",{style:{textAlign:"right",minWidth:"55px"}},
              h("div",{style:{fontWeight:"800",fontSize:"12px",color:barColor}},errRate+"%"),
              h("div",{style:{fontSize:"10px",color:"#444"}},v.errors+"/"+v.attempts)
            )
          ));
        });
        statsDiv.appendChild(problemList);
      }
      statsDiv.appendChild(h("div",{style:{fontSize:"10px",color:"#555",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}},"Historia testów"));
      const histList=h("div",{style:{display:"flex",flexDirection:"column",gap:"4px"}});
      [...history].reverse().forEach(t=>{
        histList.appendChild(h("div",{style:{background:"#10111e",border:"1px solid #ffffff08",borderRadius:"10px",padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"5px"}},
          h("div",null,
            h("span",{style:{fontSize:"11px",color:"#666"}},new Date(t.date).toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})),
            h("span",{style:{fontSize:"10px",color:"#444",marginLeft:"6px"}},t.tiempo)
          ),
          h("div",{style:{display:"flex",gap:"10px",alignItems:"center"}},
            h("span",{style:{fontFamily:"Georgia,serif",fontSize:"15px",fontWeight:"700",color:t.pct>=70?"#00b894":t.pct>=50?"#fdcb6e":"#e17055"}},t.totalPts,h("span",{style:{fontSize:"11px",color:"#444"}},"/"+t.maxPts)),
            h("span",{style:{fontWeight:"700",fontSize:"12px",color:t.pct>=70?"#00b894":t.pct>=50?"#fdcb6e":"#e17055"}},t.pct+"%")
          )
        ));
      });
      statsDiv.appendChild(histList);
    }
    content.appendChild(statsDiv);

  } else { // table
    const tableVerbos=S.filter==="all"?VERBOS:VERBOS.filter(v=>v.tipo===S.filter);
    const tablePersonas=S.tiempo==="imperativo"?PERSONAS.filter((_,i)=>i!==0):PERSONAS;
    const tableDiv=h("div",{style:{maxWidth:"1200px",margin:"0 auto",padding:"18px 14px"}},
      h("div",{style:{display:"flex",gap:"5px",marginBottom:"14px",flexWrap:"wrap"}},
        ...[["all","Wszystkie"],["nieregularny","Nieregularne"],["regularny","Regularne"]].map(([val,lbl])=>
          h("button",{className:"pill",style:{background:S.filter===val?acc+"30":"transparent",color:S.filter===val?acc:"#444",border:`1px solid ${S.filter===val?acc+"44":"#ffffff0d"}`,fontWeight:S.filter===val?"800":"500"},
            onClick:()=>{S.filter=val;render();}},lbl)
        )
      ),
      h("div",{className:"scroll-x"},
        h("table",null,
          h("thead",null,h("tr",null,
            h("th",{style:{textAlign:"left",color:acc}},"Bezokolicznik"),
            h("th",{style:{color:"#555"}},"Typ"),
            ...tablePersonas.map(p=>h("th",{style:{color:"#888"}},p))
          )),
          h("tbody",null,...tableVerbos.map(v=>
            h("tr",null,
              h("td",{style:{borderLeft:`2px solid ${v.tipo==="nieregularny"?"#e8c46a55":"#55efc455"}`}},
                h("span",{style:{fontFamily:"Georgia,serif",fontWeight:"700",fontSize:"13px"}},v.inf),
                h("span",{style:{color:"#444",fontSize:"10px",marginLeft:"5px",fontStyle:"italic"}},"("+v.trad+")")
              ),
              h("td",null,h("span",{className:"tag",style:{background:(v.tipo==="nieregularny"?"#e8c46a":"#55efc4")+"18",color:v.tipo==="nieregularny"?"#e8c46a":"#55efc4",border:`1px solid ${(v.tipo==="nieregularny"?"#e8c46a":"#55efc4")}30`,fontSize:"9px"}},v.tipo==="nieregularny"?"niereg.":"reg.")),
              ...tablePersonas.map((_,i)=>{const ri=S.tiempo==="imperativo"?i+1:i;const f=getForma(v,S.tiempo,ri);return h("td",{style:{fontFamily:"Georgia,serif",fontStyle:"italic",color:"#c0c0e0",fontSize:"12px"}},f??h("span",{style:{color:"#2a2a3a"}},"—"));})
            )
          ))
        )
      ),
      S.tiempo==="imperativo"?h("div",{style:{marginTop:"8px",fontSize:"11px",color:"#444"}},"* Imperativo nie ma formy dla yo."):null
    );
    content.appendChild(tableDiv);
  }

  app.appendChild(content);
}

try {
  render();
} catch(e) {
  document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#e17055;font-family:Georgia,serif"><div style="font-size:40px;margin-bottom:16px">⚠️</div><div style="font-size:18px;margin-bottom:8px">Błąd aplikacji</div><div style="font-size:13px;color:#888;margin-bottom:20px">'+e.message+'</div><button onclick="localStorage.clear();location.reload()" style="background:#a29bfe;color:#07080f;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer">Wyczyść cache i odśwież</button></div>';
}
if('serviceWorker' in navigator){
  // Unregister any old broken service workers first
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
  // Register fresh after a short delay
  setTimeout(()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }, 1000);
}
</script></body></html>
